# Publishes @varnsecurity/cli to npm with provenance when a tag cli-v<version>
# is pushed, and only if that version is the one in packages/cli/package.json.
# Uses npm Trusted Publishing: npm trusts this workflow (repository
# KrissaNSE/varn-cli, workflow publish.yml, environment npm) through GitHub's
# OIDC token, so there is no npm token to leak. The package is set to refuse
# token publishing. Needs npm 11.5.1 or later.
name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      # OIDC token for npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "cli-v$version" ]; then
            echo "::error::tag $TAG does not match packages/cli/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cli
      - run: node packages/cli/dist/varn.mjs --version
      # Trusted publishing needs npm 11.5.1+; Node 22 ships npm 10.
      - run: npm install --global npm@11
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
